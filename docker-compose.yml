# Local or single-server run: Postgres (PostGIS + pgvector), the API, and the web app behind Caddy.
#   docker compose up -d --build
#   docker compose run --rm api python -m app.db.migrate
# Data loading is described in README "Running with Docker".
services:
  db:
    build: { context: deploy, dockerfile: db.Dockerfile }
    environment:
      POSTGRES_DB: regengine
      POSTGRES_USER: regengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regengine -d regengine"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    image: cover-regulatory-api
    environment:
      DATABASE_URL: postgresql://regengine:${POSTGRES_PASSWORD}@db:5432/regengine
      LLM_MODEL_ID: ${LLM_MODEL_ID:-claude-opus-5-5}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_SCRYPT: ${ADMIN_PASSWORD_SCRYPT:-}
      DEMO_INVITE_CODE: ${DEMO_INVITE_CODE:-}
      ANTHROPIC_COVER_API_KEY: ${ANTHROPIC_COVER_API_KEY:-}  # optional; enables the follow-up chat
      TRUST_PROXY_HEADERS: "true"  # the api is reached only through the web (Caddy) container
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # Deletes feedback older than FEEDBACK_RETENTION_DAYS, once a day.
  purge:
    image: cover-regulatory-api
    command: ["sh", "-c", "while true; do python -m app.api.purge; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://regengine:${POSTGRES_PASSWORD}@db:5432/regengine
      FEEDBACK_RETENTION_DAYS: ${FEEDBACK_RETENTION_DAYS:-14}
    depends_on: [api]
    restart: unless-stopped

  # Weekly source check: re-fetches downloadable regulation documents; changed text sends its rules back to review.
  refresh:
    image: cover-regulatory-api
    command: ["sh", "-c", "sleep 3600; while true; do python -m app.ingest.regtext.refresh; sleep 604800; done"]
    environment:
      DATABASE_URL: postgresql://regengine:${POSTGRES_PASSWORD}@db:5432/regengine
      REGTEXT_RAW_DIR: /tmp/regtext
    depends_on: [api]
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["${WEB_PORT:-8080}:80", "${TLS_PORT:-8443}:443"]
    volumes: [caddy_data:/data]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
