stages:
  - secrets
  - check

gitleaks:
  stage: secrets
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git --redact --verbose .

# Lint and unit tests. Tests that need the loaded database (API, golden parcels, adversarial) skip
# themselves when no database is reachable; the db-tests job below runs them against the loaded data.
backend:
  stage: check
  image: python:3.13-slim
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - pip install --quiet uv==0.11.32
    - cd backend && uv sync --frozen
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -q --junitxml=pytest-junit.xml
  artifacts:
    when: always
    reports:
      junit: backend/pytest-junit.xml

# The golden, API and adversarial suites against the loaded database. The dump holds regulation text saved by
# hand, so it is kept out of git in the project's private package registry and fetched with the job token.
# Bump DB_DUMP_VERSION when a new dump is published.
db-tests:
  stage: check
  image: pgvector/pgvector:0.8.1-pg16-bookworm
  variables:
    DB_DUMP_VERSION: "2026.10.17-wave9c"
    DATABASE_URL: postgresql://regengine@localhost:5432/regengine
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-postgis-3 curl ca-certificates > /dev/null
    - mkdir -p /tmp/pg && chown postgres /tmp/pg
    - su postgres -c "/usr/lib/postgresql/16/bin/initdb -D /tmp/pg -A trust -U postgres > /dev/null"
    - su postgres -c "/usr/lib/postgresql/16/bin/pg_ctl -D /tmp/pg -l /tmp/pg/log -w start"
    - psql -U postgres -h localhost -c "CREATE ROLE regengine LOGIN SUPERUSER" -c "CREATE DATABASE regengine OWNER regengine"
    - >-
      curl -sSf --header "JOB-TOKEN: $CI_JOB_TOKEN" -o /tmp/regengine.dump
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/regengine-db/$DB_DUMP_VERSION/regengine.dump"
    - pg_restore --no-owner --no-privileges -U regengine -h localhost -d regengine /tmp/regengine.dump
    - rm /tmp/regengine.dump
    - curl -LsSf https://astral.sh/uv/0.11.32/install.sh | sh > /dev/null && export PATH="$HOME/.local/bin:$PATH"
    - cd backend && uv sync --frozen --python 3.13 && uv run python -m app.db.migrate
  script:
    # Fail instead of skipping if the database is somehow unreachable.
    - uv run python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL']).execute('SELECT 1 FROM rule_fragment LIMIT 1')"
    - uv run pytest -q tests/golden tests/api tests/adversarial --junitxml=db-junit.xml
  artifacts:
    when: always
    reports:
      junit: backend/db-junit.xml

frontend:
  stage: check
  image: node:22-slim
  before_script:
    - cd frontend && npm ci --no-audit --no-fund
  script:
    - npx vue-tsc --noEmit
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml
    - npx vite build
  artifacts:
    when: always
    reports:
      junit: frontend/vitest-junit.xml

# The AWS production setup (infra/aws): format, validate, and apply it to mocked providers. No AWS credentials are
# used and nothing is created.
terraform:
  stage: check
  image:
    name: hashicorp/terraform:1.13.4
    entrypoint: [""]
  script:
    - cd infra/aws
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate
    - terraform test -junit-xml=terraform-junit.xml
  artifacts:
    when: always
    reports:
      junit: infra/aws/terraform-junit.xml
