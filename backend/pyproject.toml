[project]
name = "regengine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyproj>=3.7",
    "pyyaml>=6",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pip-licenses>=5",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
