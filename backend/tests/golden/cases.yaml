# Golden cases: self-selected parcels (vacant or City-owned lots where possible), identified by APN only.
# Expected values were calculated (by Claude Code, not by running the engine) from the cited code text and the parcel's own data (lot area from
# the County layer; width and depth from the fitted rectangle), not copied from the engine's output.
# Hand calculations by Claude Code; Paawan spot-checked them against the code text on 2026-10-16 (decision D17).
# Every value the engine shows on these parcels is asserted (2026-10-16); `labels` pins the label where it matters.
# Wave 2 (2026-10-16) added adu_height, checked against the Caltrans service rather than the engine; not yet
# spot-checked by Paawan. The prevailing front yard rests on machine-learned outlines, so its rule is tested on
# hand-made lots in tests/unit/test_prevailing.py instead.
# A value of null means "the engine must not show a number here".
cases:
  - apn: "2121005008"   # vacant, Reseda, R1-1, ~60 x 135 ft, 8,100 sq ft
    status: ok
    expect:
      front_yard: 20.0        # LAMC 12.08 C.1: min(20% x 135 = 27, 20)
      side_yard: 7.0          # 12.08 C.2: 5 ft (width 60 >= 50) + 1 ft per 10 ft over 18 ft for a 33 ft house (+2)
      rear_yard: 15.0         # 12.08 C.3
      max_rfa: 3645           # 12.08 C.5(a): 0.45 x 8,100
      max_height: 33.0        # 12.21.1: R1, flat land
      guest_house: false      # 12.08 A.7(a): 8,100 < 10,000
      lot_minimums: true      # 12.08 C.4: 8,100 >= 5,000 and 60 >= 50
      adu_state_detached: 800.0
      jadu: 500.0
      adu_local_detached: 1200.0  # LAMC 12.22 A.33(d)(1) and Gov. Code 66314(d): detached ADU up to 1,200 sq ft
      adu_attached: 850           # 66321(b)/12.22 A.33(e)(3): 850 sq ft can't be refused; no existing home, so the 50% cap doesn't bite
      adu_height: 18.0            # 66321(b)(4)(B): the parcel's interior point is inside a Caltrans half-mile transit area (service queried directly, 2026-10-16); walking distance unconfirmed
      sb9_two_unit: 2.0           # Gov. Code 65852.21(a)
      sb9_lot_split: true         # 66411.7(a): 8,100 >= 2 x 1,200
    labels:
      adu_height: interpretive
      sb9_two_unit: interpretive
    flags_exclude: [hillside, fire_rebuild]
  - apn: "2121016012"   # vacant, Reseda, R1-1, ~50 x 110 ft, 5,452 sq ft
    status: ok
    expect:
      front_yard: 20.0        # min(22, 20)
      side_yard: 7.0          # width exactly 50 -> 5 ft base, +2 for a 33 ft house
      max_rfa: 2453           # 0.45 x 5,452 = 2,453.4
      lot_minimums: true
      rear_yard: 15.0         # 12.08 C.3
      max_height: 33.0        # 12.21.1: R1, not Hillside or Coastal
      guest_house: false      # 5,452 < 10,000
      adu_state_detached: 800.0  # Gov. Code 66323(a)(2): up to 800 sq ft must be approved
      adu_local_detached: 1200.0  # LAMC 12.22 A.33(d)(1) and Gov. Code 66314(d): detached ADU up to 1,200 sq ft
      adu_attached: 850           # 66321(b)/12.22 A.33(e)(3): 850 sq ft can't be refused; no existing home, so the 50% cap doesn't bite
      jadu: 500.0                 # Gov. Code 66313(d): 500 sq ft, inside a proposed single-family home
  - apn: "2121002004"   # vacant, Reseda, R1-1, ~25 x 130 ft, 3,249 sq ft (substandard lot)
    status: ok
    expect:
      side_yard: 5.0          # 12.08 C.2: 10% x 25 = 2.5, but not less than 3 ft; +2 for a 33 ft house
      max_rfa: 1462           # 0.45 x 3,249 = 1,462.05
      lot_minimums: false     # 3,249 < 5,000 and 25 < 50
      front_yard: 20.0        # min(20% x 130 = 26, 20)
      rear_yard: 15.0
      max_height: 33.0
      guest_house: false      # 3,249 < 10,000
      adu_state_detached: 800.0  # Gov. Code 66323(a)(2): up to 800 sq ft must be approved
      adu_local_detached: 1200.0  # LAMC 12.22 A.33(d)(1) and Gov. Code 66314(d): detached ADU up to 1,200 sq ft
      adu_attached: 850           # 66321(b)/12.22 A.33(e)(3): 850 sq ft can't be refused; no existing home, so the 50% cap doesn't bite
      jadu: 500.0                 # Gov. Code 66313(d): 500 sq ft, inside a proposed single-family home
  - apn: "4359016023"   # vacant, R1-1, 16,403 sq ft, inside the West LA transportation specific plan
    status: ok
    expect:
      guest_house: true       # 16,403 >= 10,000
      max_rfa: 7381           # 0.45 x 16,403 = 7,381.35
      front_yard: 20.0        # min(20% x 212 = 42.4, 20)
      side_yard: 7.0          # width 108 >= 50 -> 5 ft, +2 for a 33 ft house
      rear_yard: 15.0
      max_height: 33.0
      lot_minimums: true      # 16,403 >= 5,000 and 108 >= 50
      adu_state_detached: 800.0  # Gov. Code 66323(a)(2): up to 800 sq ft must be approved
      adu_local_detached: 1200.0  # LAMC 12.22 A.33(d)(1) and Gov. Code 66314(d): detached ADU up to 1,200 sq ft
      adu_attached: 850           # 66321(b)/12.22 A.33(e)(3): 850 sq ft can't be refused; no existing home, so the 50% cap doesn't bite
      jadu: 500.0                 # Gov. Code 66313(d): 500 sq ft, inside a proposed single-family home
      plan_wla_timp: "Transportation fee; no envelope rules"   # WLA TIMP sets no envelope standards (Sections 1-13)
    labels:
      max_rfa: derived        # the plan is read, so it no longer turns the zone's values into interpretations
      plan_wla_timp: interpretive
    flags_exclude: [overlay_plan]
  - apn: "4412014028"   # vacant, Pacific Palisades, R1-1, hillside + coastal + 2025 fire perimeter
    status: ok
    expect:
      front_yard: 20.0        # Table 12.21 C.10-1 keeps the R1 front yard: min(20% x 201, 20)
      max_height: 33.0        # Table 12.21 C.10-4, Height District 1, roof slope 25% or more
      max_rfa: 4272           # C.10(b), by hand from the stored USGS slope bands: 3,584x.45 + 2,207x.45 + 1,755x.40 + 1,582x.35 + 1,367x.30 + 1,302x0 = 4,272 > 25% x 11,793
      sb9_two_unit: false     # EO 9 paragraph 1
      sb9_lot_split: false
      eo1_footprint: null     # vacant: no building outline loaded, so no footprint to scale
      max_lot_coverage: 4717  # 12.21 C.10(e): 40% x 11,793 (68 ft wide, so not the 45% substandard-lot row)
      guest_house: true       # 11,793 >= 10,000 (12.08 A.7)
      side_yard: 7.0          # 5 ft, + 1 ft per 10 ft over 18 ft (Table 12.21 C.10-1) for 33 ft
      rear_yard: 15.0
      lot_minimums: true      # 11,793 >= 5,000 and 68 >= 50 (12.08 C.4 is not a flat-land-only rule)
      adu_state_detached: 800.0  # Gov. Code 66323(a)(2): up to 800 sq ft must be approved
      adu_local_detached: 1200.0  # LAMC 12.22 A.33(d)(1) and Gov. Code 66314(d): detached ADU up to 1,200 sq ft
      adu_attached: 850           # 66321(b)/12.22 A.33(e)(3): 850 sq ft can't be refused; no existing home, so the 50% cap doesn't bite
      jadu: 500.0                 # Gov. Code 66313(d): 500 sq ft, inside a proposed single-family home
      adu_height: 16.0            # 66321(b)(4)(A): no Caltrans half-mile transit area at the parcel (service queried directly, 2026-10-16)
    labels:
      adu_height: derived
      max_height: interpretive  # Coastal Zone too: 12.21.1 sends Hillside lots to C.10-4, but names 45 ft for coastal
      max_rfa: interpretive     # slope bands estimated from USGS elevation, not a survey
      sb9_two_unit: derived     # EO 9: no SB 9 applications in the VHFHSZ inside the Palisades Fire area
      sb9_lot_split: derived
    flags_include: [fire_rebuild, hillside, coastal, vhfhsz]
  - apn: "2126005015"   # vacant, R1-2-RIO, ~50 x 245 ft, 12,260 sq ft: supplemental district not modeled
    status: ok
    expect:
      front_yard: 20.0        # min(20% x 245 = 49, 20)
      side_yard: 7.0          # width exactly 50 -> 5 ft, +2 for a 33 ft house
      rear_yard: 15.0
      max_rfa: 5517           # 0.45 x 12,260 = 5,517
      max_height: 33.0        # 12.21.1 "notwithstanding" paragraph: R1 33 ft off Hillside/Coastal, any height district
      lot_minimums: true      # 12,260 >= 5,000 and 50 >= 50
      guest_house: true       # 12,260 >= 10,000
      adu_state_detached: 800.0  # Gov. Code 66323(a)(2): up to 800 sq ft must be approved
      adu_local_detached: 1200.0  # LAMC 12.22 A.33(d)(1) and Gov. Code 66314(d): detached ADU up to 1,200 sq ft
      adu_attached: 850           # 66321(b)/12.22 A.33(e)(3): 850 sq ft can't be refused; no existing home, so the 50% cap doesn't bite
      jadu: 500.0                 # Gov. Code 66313(d): 500 sq ft, inside a proposed single-family home
    # The RIO district is not modeled, so the R1 envelope is shown only as an interpretation.
    labels:
      front_yard: interpretive
      side_yard: interpretive
      rear_yard: interpretive
      max_rfa: interpretive
      max_height: interpretive
      lot_minimums: interpretive
    flags_include: [zone_unmodeled]
  - apn: "2104024009"   # Built-up flat-land R1 lot (one home, Assessor 1,122 sq ft); only the long side reads as a street
    status: ok
    expect:
      front_yard: 12.0        # 20% x 60 ft depth (front taken on the long side)
      side_yard: 7.0          # 5 ft, +2 for a 33 ft house
      rear_yard: 15.0
      max_rfa: 3168           # 0.45 x 7,039 = 3,167.6
      max_height: 33.0
      guest_house: false      # 7,039 < 10,000 sq ft
      adu_attached: 850       # 50% x 1,122 = 561, raised to the 850 sq ft that can't be refused
      sb9_two_unit: 2.0       # Gov. Code 65852.21(a): R1, no HPOZ, fire, fault or flood layer here
      sb9_lot_split: true     # 66411.7(a): 7,039 >= 2 x 1,200, and an equal split is over 40%
    labels:
      lot_dimensions: approximate
      front_yard: interpretive   # the front may be the short side
      side_yard: interpretive
      sb9_two_unit: interpretive # tenant history and the 65913.4 site list cannot be checked
  - apn: "2121003007"   # Built-up through lot (streets on opposite sides), 20,252 sq ft
    status: ok
    expect:
      front_yard: 20.0
      side_yard: 7.0
      max_rfa: 9113           # 0.45 x 20,252 = 9,113.4
      guest_house: true
      adu_attached: 850       # 50% x 1,529 = 764, raised to 850
    labels:
      rear_yard: interpretive    # 12.21 C.1(h): a through lot has a front yard at each end
  # R2 and RE (wave 7). Flat land, Height District 1.
  - apn: "4359015009"   # RE20-1, 24,208 sq ft, inside a specific plan area (so interpretive)
    status: ok
    expect:
      front_yard: 25.0        # 20% of 191 ft, capped at 25 ft (12.07.01 C.1)
      side_yard: 10.0         # RE20: 10 ft (12.07.01 C.2(b))
      rear_yard: 25.0         # 25% of 191 ft, capped at 25 ft (12.07.01 C.3)
      max_height: 36.0        # RE11-RE40 off the Hillside Area and Coastal Zone (12.21.1)
      max_rfa: 8473           # 35% x 24,208 (12.07.01 C.5)
      lot_minimums: true      # 20,000 sq ft and 80 ft
      guest_house: true       # 20,000 sq ft minimum in RE (12.07.01 A.6)
      sb9_lot_split: true
    labels:
      max_rfa: derived
  - apn: "2126020001"   # R2-1-RIO, 7,666 sq ft, 48 ft wide
    status: ok
    expect:
      dwelling_units: 2       # 2,500 sq ft per home, at most two (12.09 A.2, C.4)
      front_yard: 20.0        # the R1 front yard (12.09 C.1)
      side_yard: 6.8          # 10% of 48 ft = 4.8 ft, plus 2 ft for a 33 ft building (12.08 C.2(b))
      rear_yard: 15.0
      max_height: 33.0        # R2 (12.21.1)
      lot_minimums: false     # under 50 ft wide (12.09 C.4)
      sb9_two_unit: false     # SB 9 applies only in single-family zones
      guest_house: false
    labels:
      max_rfa: interpretive   # 3 x buildable area, measured on the fitted outline
      sb9_two_unit: interpretive
  - apn: "2126009001"   # R2-2-RIO: Height District 2, envelope withheld
    status: ok
    expect:
      max_rfa: null
      max_height: null
      dwelling_units: 2
    labels:
      max_rfa: withheld
      front_yard: withheld
  - apn: "4411004013"   # RE15-1 in a Hillside Area: envelope withheld
    status: ok
    expect:
      front_yard: null
      max_rfa: null
      lot_minimums: true
    labels:
      side_yard: withheld
      max_height: withheld
  - apn: "2118028002"   # R2-2D: a D limitation (12.32 G.4) and Height District 2
    status: ok
    labels:
      max_height: withheld
    flags_include: [zone_unmodeled]
  - apn: "4412004026"   # RD2-1: multiple-dwelling zone, not modeled
    status: zone_not_modeled
  - apn: "2118015001"   # [Q]C2-2D-CDO: commercial, outside the R1 family
    status: zone_not_modeled
  - apn: "5179003026"   # Boyle Heights: Chapter 1A in effect
    status: regime_not_modeled
    expect:
      ch1a_density: 2.0       # [H3-MU3-3][RX2-2L][CPIO]: Density District 2L, two units per lot (Div. 6B.1)
    labels:
      ch1a_zone: verified
      ch1a_density: interpretive   # the CPIO is not loaded
  - apn: "5189012015"   # Boyle Heights [VN1-MU3-3][RX2-15][CPIO], 6,757 sq ft
    status: regime_not_modeled
    expect:
      ch1a_density: 4         # floor(6,757 / 1,500) (Div. 6B.2, Sec. 6C.1.2 D.3)
  - apn: "4327028024"   # Beverly Hills: outside the City
    status: outside_city
  # Unincorporated LA County, Del Aire (wave 9). Hand calculations by Claude Code from the Title 22 copy Paawan supplied
  # (edition not stated), not yet spot-checked by Paawan. Every Title 22 value is labelled interpretive because of the edition.
  - apn: "4142004002"   # Del Aire, County R-1, ~70 x 85 ft, 5,259 sq ft, interior lot
    status: ok
    expect:
      front_yard: 20.0        # Table 22.18.040-A
      side_yard: 5.0          # Table 22.18.040-A; width 70 >= 50, so 22.110.080 C.2 does not apply
      rear_yard: 15.0         # Table 22.18.040-A; depth 85 >= 75, so 22.110.080 D does not apply
      max_height: 35.0        # 22.18.040 B.1
      lot_minimum: 5000       # 22.110.130 A.4: plain R-1 takes the R-1-5000 area
      adu_state_detached: 800.0  # Gov. Code 66323(a)(2), binding on counties
      jadu: 500.0             # Gov. Code 66313(d)
      county_adu: 1200.0      # 22.140.640 G.1.a (Ord. 2025-0029)
      sb9_two_unit: 2.0       # Gov. Code 65852.21(a)
      sb9_lot_split: true     # 66411.7(a): 5,259 >= 2 x 1,200
    labels:
      county_adu: interpretive
      front_yard: interpretive
      side_yard: interpretive
      rear_yard: interpretive
      max_height: interpretive
      lot_minimum: interpretive
    flags_include: [flag_county_pasd]   # South Bay PASD (22.318), adopted 2025-03-11
    flags_exclude: [flag_county_hma, flag_county_csd, flag_county_setback_district]
  - apn: "4144001012"   # Del Aire, County R-1, ~40 x 132 ft, 5,292 sq ft (narrow lot)
    status: ok
    expect:
      side_yard: 4.0          # 22.110.080 C.2: width 40 < 50, so max(10% x 40 = 4.0, 3)
      front_yard: 20.0
      rear_yard: 15.0
      max_height: 35.0
      lot_minimum: 5000
  - apn: "4142004001"   # Del Aire, County R-1, reversed corner lot (key lot 4142004033 fronts its side street)
    status: ok
    expect:
      street_side_yard: 10.0  # Table 22.18.040-A, Corner Side, Reversed Corner Lot column
      side_yard: 5.0
    labels:
      street_side_yard: interpretive
  - apn: "4143016041"   # Del Aire, County R-1, ~88 x 59 ft, 3,460 sq ft (shallow, substandard)
    status: ok
    expect:
      rear_yard: 11.7         # 22.110.080 D: depth 58.6 < 75, so max(20% x 58.6 = 11.72, 10)
      side_yard: 5.0
      front_yard: 20.0
      max_height: 35.0
      lot_minimum: 5000       # 3,460 is below it: a substandard lot (22.110.150)
      sb9_lot_split: true     # 3,460 >= 2 x 1,200
  - apn: "4142007019"   # Del Aire, County R-1, ~70 x 85 ft, touches a Hillside Management Area
    status: ok
    expect:
      front_yard: 20.0
      max_height: 35.0
    flags_include: [flag_county_hma]
  - apn: "4144001800"   # Del Aire, County R-3: not modeled
    status: zone_not_modeled
